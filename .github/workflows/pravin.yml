name: CI


on:
  

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
 
  build:
    
    runs-on: self-hosted

    
    steps:
      
      
      - uses: actions/checkout@v4


      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
